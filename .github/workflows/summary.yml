name: daily-summary

on:
  schedule:
    - cron: "0 18 * * *"         # 20:00 שעון ישראל בחורף (בשעון קיץ: 21:00). לשעון קיץ שנה ל-"0 17 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: news-state
  cancel-in-progress: false

jobs:
  summary:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: python -m bot.summary
      - if: always()
        run: |
          git config user.name "news-agent"
          git config user.email "news-agent@users.noreply.github.com"
          git add state/state.json
          git diff --cached --quiet || (git commit -m "state update [skip ci]" && git push)
