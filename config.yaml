# ============================================================
#  הגדרות סוכן החדשות – אפשר לשנות כאן בלי לגעת בקוד
# ============================================================

channel_name: "ABU TAMER NEWS"     # שם הערוץ (מופיע בחתימת הסיכום היומי)

# מצב פרסום:
#   auto     – הכול מתפרסם אוטומטית
#   approval – הכול נשלח אליך לאישור קודם
#   hybrid   – רגיל מתפרסם אוטומטית, נושאים ביטחוניים רגישים נשלחים לאישור
publish_mode: hybrid

# סף חשיבות (1–5). פריט מתחת לסף לא יתפרסם.
# 2 = "כמה שיותר", 3 = מבזקים חשובים בלבד
# ---- מצב ניסיון חסכוני (ברירת המחדל כרגע) ----
# כשתראה שהכול עובד, עבור למצב מלא: min_importance: 2, max_posts_per_run: 6,
# daily_post_cap: 80, writer_model: claude-sonnet-5-5
min_importance: 3

max_posts_per_run: 3           # מניעת הצפה ביום עמוס
daily_post_cap: 25             # תקרה קשיחה: אחרי 25 פוסטים ב-24 שעות הסוכן מפסיק לפנות ל-Claude עד למחרת
max_item_age_minutes: 180      # מתעלמים מכתבות ישנות מזה
first_run_window_minutes: 60   # בהרצה הראשונה: רק השעה האחרונה

# מודלים של Claude
triage_model: claude-haiku-5-5     # סינון ודירוג (זול ומהיר)
writer_model: claude-haiku-5-5     # כתיבה. במצב ניסיון Haiku (זול פי 20). לאיכות עברית גבוהה יותר: claude-sonnet-5-5

# תמונה: Telegram מציג תצוגה מקדימה גדולה (תמונה + כותרת) מקישור הכתבה.
# זה חוקי, כי התמונה מוצגת מהאתר המקורי עם קרדיט.
show_link_preview: true

# סיכום יומי
daily_summary:
  enabled: true

# ------------------------------------------------------------
# מקורות. weight = אמינות/עדיפות (1–3). מקור שלא נגיש ידולג אוטומטית.
# אפשר להוסיף כל פיד RSS.
# ------------------------------------------------------------
feeds:
  # ישראל
  - {name: "ynet מבזקים",        url: "https://www.ynet.co.il/Integration/StoryRss1854.xml", weight: 3}
  - {name: "ynet",               url: "https://www.ynet.co.il/Integration/StoryRss2.xml",    weight: 2}
  - {name: "Times of Israel",    url: "https://www.timesofisrael.com/feed/",                weight: 3}
  - {name: "Jerusalem Post",     url: "https://www.jpost.com/rss/rssfeedsfrontpage.aspx",   weight: 2}
  # עולם / ארה"ב
  - {name: "BBC Middle East",    url: "https://feeds.bbci.co.uk/news/world/middle_east/rss.xml",     weight: 3}
  - {name: "BBC US & Canada",    url: "https://feeds.bbci.co.uk/news/world/us_and_canada/rss.xml",   weight: 2}
  - {name: "NYT Middle East",    url: "https://rss.nytimes.com/services/xml/rss/nyt/MiddleEast.xml", weight: 3}
  - {name: "NYT Politics",       url: "https://rss.nytimes.com/services/xml/rss/nyt/Politics.xml",   weight: 2}
  - {name: "Al Jazeera",         url: "https://www.aljazeera.com/xml/rss/all.xml",                  weight: 1}
  # חיפושי Google News (מאגדים כמה מקורות – משמש גיבוי למהירות)
  - {name: "Google News: Iran Israel", url: "https://news.google.com/rss/search?q=Iran+Israel+when:2h&hl=en-US&gl=US&ceid=US:en", weight: 1, aggregator: true}
  - {name: "Google News: Iran US",     url: "https://news.google.com/rss/search?q=Iran+%22United+States%22+when:2h&hl=en-US&gl=US&ceid=US:en", weight: 1, aggregator: true}
  - {name: "Google News: איראן",       url: "https://news.google.com/rss/search?q=%D7%90%D7%99%D7%A8%D7%90%D7%9F+when:2h&hl=he&gl=IL&ceid=IL:he", weight: 1, aggregator: true}
